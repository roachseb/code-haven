# ═══════════════════════════════════════════════════════════════
# Code Haven — Build & Publish Builder Images
#
# Builds parameterized C++ builder images and pushes them to GHCR.
# Triggered on changes to images/ or manually via workflow_dispatch.
#
# Published to: ghcr.io/<org>/code-haven/cpp-builder:<tag>
# ═══════════════════════════════════════════════════════════════
name: "🐳 Builder Images"

on:
  push:
    branches: [main]
    paths: ['images/**']
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  cpp-builder:
    name: "C++ Builder — ${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            version: "13"
            tag: gcc13
          - compiler: gcc
            version: "14"
            tag: gcc14
          - compiler: clang
            version: "16"
            tag: clang16
          - compiler: clang
            version: "18"
            tag: clang18
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: images/cpp-builder
          push: true
          build-args: |
            COMPILER=${{ matrix.compiler }}
            COMPILER_VERSION=${{ matrix.version }}
          tags: |
            ghcr.io/${{ github.repository }}/cpp-builder:${{ matrix.tag }}
            ghcr.io/${{ github.repository }}/cpp-builder:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Code Haven C++ Builder — ${{ matrix.compiler }} ${{ matrix.version }}
            code-haven.compiler=${{ matrix.compiler }}
            code-haven.compiler-version=${{ matrix.version }}

      - name: Summary
        run: |
          {
            echo "## 🐳 C++ Builder Image — ${{ matrix.tag }}"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Image | \`ghcr.io/${{ github.repository }}/cpp-builder:${{ matrix.tag }}\` |"
            echo "| Compiler | ${{ matrix.compiler }} ${{ matrix.version }} |"
            echo "| SHA tag | \`${{ matrix.tag }}-${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
