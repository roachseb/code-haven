# ═══════════════════════════════════════════════════════════════
# Code Haven — PHP Build Pipeline
# Internal reusable workflow — called from devsecops.yml
# ═══════════════════════════════════════════════════════════════
name: "🐘 PHP"

on:
  workflow_call:
    inputs:
      runner: { type: string, default: 'ubuntu-latest' }
      php_disabled: { type: boolean, default: false }
      php_version: { type: string, default: '8.3' }
      php_extensions: { type: string, default: 'mbstring, xml, xdebug' }
      has_twig: { type: string, default: 'false' }

jobs:
  php-test:
    name: "🐘 PHP Test"
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          coverage: xdebug
      - name: Install & Test
        run: |
          composer install --prefer-dist --no-progress
          PHPUNIT=$(find . -name phpunit -o -name phpunit.phar -type f | head -1)
          [[ -z "$PHPUNIT" ]] && PHPUNIT="./vendor/bin/phpunit"
          php "$PHPUNIT" \
            --coverage-text \
            --coverage-cobertura=php-reports/cobertura.xml \
            --log-junit=php-reports/junit.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: php-reports, path: php-reports, retention-days: 7 }
      - name: Summary
        if: always()
        run: |
          {
            echo "## 🐘 PHP Test Results"
            echo ""
            echo "> **What this does:** Runs your PHPUnit test suite and collects code coverage"
            echo "> to measure how well your tests exercise the codebase."
            echo ""
            if [[ -f php-reports/junit.xml ]]; then
              TOTAL=$(grep -c '<testcase' php-reports/junit.xml 2>/dev/null || echo "0")
              FAILURES=$(grep -c '<failure' php-reports/junit.xml 2>/dev/null || echo "0")
              ERRORS=$(grep -c '<error' php-reports/junit.xml 2>/dev/null || echo "0")
              FAIL_COUNT=$((FAILURES + ERRORS))
              if [[ "$FAIL_COUNT" -eq 0 ]]; then
                echo "- ✅ **${TOTAL}** tests passed"
              else
                echo "- ❌ **${FAIL_COUNT}** of **${TOTAL}** tests failed"
                echo ""
                echo "#### 🔧 Debug locally"
                echo '```bash'
                echo "./vendor/bin/phpunit --verbose"
                echo '```'
              fi
            else
              echo "- ⚠️ No test results found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: dorny/test-reporter@v2
        if: >-
          !cancelled() &&
          (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) &&
          github.actor != 'dependabot[bot]'
        continue-on-error: true
        with:
          name: PHP Tests
          path: php-reports/junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  php-twig-lint:
    name: "🐘 PHP Twig Lint"
    if: inputs.has_twig == 'true'
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ inputs.php_version }}' }
      - run: composer install --prefer-dist --no-progress
      - run: php bin/console lint:twig templates/
