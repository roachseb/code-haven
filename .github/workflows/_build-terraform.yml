# ═══════════════════════════════════════════════════════════════
# Code Haven — Terraform / OpenTofu Pipeline
# Internal reusable workflow — called from devsecops.yml
#
# Workspace-based deployment (Option B):
#   Single configuration + per-environment var files.
#   terraform.tfvars.dev / terraform.tfvars.staging / terraform.tfvars.prod
#
# Pipeline:  init → fmt → validate → tflint → plan → (gate) → apply
#
# Branch gating:
#   PR / feature    → plan all environments (never apply)
#   main            → auto-apply dev, plan staging+prod
#   tag / release   → apply prod (and staging if not yet applied)
#
# Supported tools: terraform, tofu (OpenTofu)
# Cloud auth: delegates to code-haven/actions/cloud-login
# ═══════════════════════════════════════════════════════════════
name: "🏗️ Terraform"

on:
  workflow_call:
    inputs:
      runner:          { type: string,  default: 'ubuntu-latest' }
      tf_disabled:     { type: boolean, default: false }
      tf_version:      { type: string,  default: '1.9' }
      tf_tool:         { type: string,  default: 'terraform' }   # terraform | tofu
      tf_cloud_provider: { type: string, default: '' }           # aws | azure | gcp
      tf_working_dir:  { type: string,  default: '.' }           # Root of TF config
      tf_environments: { type: string,  default: 'dev,staging,prod' }
      tf_auto_apply_dev:     { type: boolean, default: true }
      tf_auto_apply_staging: { type: boolean, default: false }
      tf_auto_apply_prod:    { type: boolean, default: false }
      tf_destroy_enabled:    { type: boolean, default: false }
      tf_infracost_enabled:  { type: boolean, default: false }
      has_terraform:   { type: string,  default: 'false' }
      is_default_branch: { type: string, default: 'false' }
      is_tag:          { type: string,  default: 'false' }
      is_pr:           { type: string,  default: 'false' }
    secrets:
      # ── Cloud credentials (one set per provider) ──────
      AWS_ROLE_ARN:                     { required: false }
      AWS_REGION:                       { required: false }
      AZURE_CLIENT_ID:                  { required: false }
      AZURE_CLIENT_SECRET:              { required: false }
      AZURE_TENANT_ID:                  { required: false }
      AZURE_SUBSCRIPTION_ID:            { required: false }
      GCP_WORKLOAD_IDENTITY_PROVIDER:   { required: false }
      GCP_SERVICE_ACCOUNT:              { required: false }
      # ── Infracost (optional) ──────────────────────────
      INFRACOST_API_KEY:                { required: false }

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ──────────────────────────────────────────────────────────
  # Validate — fmt, validate, tflint (runs on every push)
  # ──────────────────────────────────────────────────────────
  tf-validate:
    name: "🏗️ Terraform Validate"
    if: inputs.has_terraform == 'true' && !inputs.tf_disabled
    runs-on: ${{ inputs.runner }}
    outputs:
      environments_json: ${{ steps.envs.outputs.json }}
    defaults:
      run:
        working-directory: ${{ inputs.tf_working_dir }}
    steps:
      - uses: actions/checkout@v6

      - name: Parse environments
        id: envs
        shell: bash
        run: |
          # Convert comma-separated "dev,staging,prod" → JSON array ["dev","staging","prod"]
          JSON=$(echo '${{ inputs.tf_environments }}' | \
            tr ',' '\n' | sed 's/^ *//;s/ *$//' | \
            jq -R . | jq -sc .)
          echo "json=$JSON" >> "$GITHUB_OUTPUT"
          echo "📋 Environments: $JSON"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        if: inputs.tf_tool == 'terraform'
        with:
          terraform_version: ${{ inputs.tf_version }}

      - name: Setup OpenTofu
        if: inputs.tf_tool == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tf_version }}

      - name: Terraform Format Check
        id: fmt
        run: ${{ inputs.tf_tool }} fmt -check -recursive -diff
        continue-on-error: true

      - name: Terraform Init
        run: ${{ inputs.tf_tool }} init -backend=false

      - name: Terraform Validate
        id: validate
        run: ${{ inputs.tf_tool }} validate -no-color

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        continue-on-error: true

      - name: Run tflint
        id: tflint
        run: |
          tflint --init 2>/dev/null || true
          tflint --format=compact || true
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🏗️ Terraform Validate"
            echo ""
            echo "> Checks formatting, syntax, and best practices for your Terraform configuration."
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Format (\`${{ inputs.tf_tool }} fmt\`) | ${{ steps.fmt.outcome == 'success' && '✅ Passed' || '⚠️ Needs formatting' }} |"
            echo "| Validate (\`${{ inputs.tf_tool }} validate\`) | ${{ steps.validate.outcome == 'success' && '✅ Valid' || '❌ Invalid' }} |"
            echo "| tflint | ${{ steps.tflint.outcome == 'success' && '✅ Clean' || '⚠️ Findings' }} |"
            echo "| Tool | \`${{ inputs.tf_tool }} ${{ inputs.tf_version }}\` |"
            if [[ "${{ steps.fmt.outcome }}" != "success" ]]; then
              echo ""
              echo "#### 🔧 Fix formatting locally"
              echo '```bash'
              echo "${{ inputs.tf_tool }} fmt -recursive"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────
  # Plan — runs for each environment (matrix)
  # ──────────────────────────────────────────────────────────
  tf-plan:
    name: "🏗️ Plan — ${{ matrix.environment }}"
    needs: tf-validate
    if: inputs.has_terraform == 'true' && !inputs.tf_disabled
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.tf-validate.outputs.environments_json) }}
    defaults:
      run:
        working-directory: ${{ inputs.tf_working_dir }}
    outputs:
      plan_exitcode_dev: ${{ steps.plan.outputs.exitcode_dev }}
      plan_exitcode_staging: ${{ steps.plan.outputs.exitcode_staging }}
      plan_exitcode_prod: ${{ steps.plan.outputs.exitcode_prod }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        if: inputs.tf_tool == 'terraform'
        with:
          terraform_version: ${{ inputs.tf_version }}

      - name: Setup OpenTofu
        if: inputs.tf_tool == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tf_version }}

      # ── Cloud Authentication ──────────────────────────
      - name: AWS Login
        if: inputs.tf_cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Azure Login
        if: inputs.tf_cloud_provider == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: GCP Login
        if: inputs.tf_cloud_provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ── Init + Plan ───────────────────────────────────
      - name: Terraform Init
        run: ${{ inputs.tf_tool }} init

      - name: Select Workspace
        run: |
          ${{ inputs.tf_tool }} workspace select ${{ matrix.environment }} 2>/dev/null \
            || ${{ inputs.tf_tool }} workspace new ${{ matrix.environment }}

      - name: Detect var file
        id: varfile
        run: |
          # Option B: terraform.tfvars.<env>
          VARFILE=""
          for candidate in \
            "terraform.tfvars.${{ matrix.environment }}" \
            "${{ matrix.environment }}.tfvars" \
            "environments/${{ matrix.environment }}.tfvars" \
            "vars/${{ matrix.environment }}.tfvars"; do
            if [[ -f "$candidate" ]]; then
              VARFILE="-var-file=$candidate"
              echo "📄 Using var file: $candidate"
              break
            fi
          done
          echo "args=$VARFILE" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          ${{ inputs.tf_tool }} plan \
            ${{ steps.varfile.outputs.args }} \
            -out=tfplan-${{ matrix.environment }} \
            -detailed-exitcode \
            -no-color 2>&1 | tee plan-output.txt
          EXITCODE=${PIPESTATUS[0]}
          set -e

          # Exit codes: 0=no changes, 1=error, 2=changes present
          echo "exitcode=$EXITCODE" >> "$GITHUB_OUTPUT"
          echo "exitcode_${{ matrix.environment }}=$EXITCODE" >> "$GITHUB_OUTPUT"

          if [[ "$EXITCODE" -eq 1 ]]; then
            echo "❌ Plan failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: |
            ${{ inputs.tf_working_dir }}/tfplan-${{ matrix.environment }}
            ${{ inputs.tf_working_dir }}/plan-output.txt
          retention-days: 5

      - name: PR Comment — Plan Output
        if: inputs.is_pr == 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = '${{ inputs.tf_working_dir }}/plan-output.txt';
            let plan = '';
            try { plan = fs.readFileSync(planPath, 'utf8'); } catch(e) { plan = 'Plan output not available'; }

            // Truncate if too long for a PR comment
            if (plan.length > 60000) {
              plan = plan.substring(0, 60000) + '\n\n... (truncated)';
            }

            const exitcode = '${{ steps.plan.outputs.exitcode }}';
            const icon = exitcode === '0' ? '✅' : exitcode === '2' ? '⚠️' : '❌';
            const status = exitcode === '0' ? 'No changes' : exitcode === '2' ? 'Changes detected' : 'Error';

            const body = `### ${icon} Terraform Plan — \`${{ matrix.environment }}\`

            **Status:** ${status}
            **Tool:** \`${{ inputs.tf_tool }} ${{ inputs.tf_version }}\`

            <details><summary>Show plan output</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`
            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Summary
        if: always()
        run: |
          EXITCODE="${{ steps.plan.outputs.exitcode }}"
          {
            echo "## 🏗️ Terraform Plan — \`${{ matrix.environment }}\`"
            echo ""
            if [[ "$EXITCODE" == "0" ]]; then
              echo "✅ **No changes.** Infrastructure matches configuration."
            elif [[ "$EXITCODE" == "2" ]]; then
              echo "⚠️ **Changes detected.** Review the plan output in artifacts."
              echo ""
              # Show resource counts from plan output
              if [[ -f plan-output.txt ]]; then
                tail -5 plan-output.txt | head -3
              fi
            else
              echo "❌ **Plan failed.** Check the logs above."
            fi
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Environment | \`${{ matrix.environment }}\` |"
            echo "| Var file | \`${{ steps.varfile.outputs.args || 'default' }}\` |"
            echo "| Provider | \`${{ inputs.tf_cloud_provider || 'not configured' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────
  # Apply — conditional on branch + environment + auto-apply flags
  # ──────────────────────────────────────────────────────────
  tf-apply-dev:
    name: "🏗️ Apply — dev"
    needs: [tf-validate, tf-plan]
    if: >-
      inputs.has_terraform == 'true'
      && !inputs.tf_disabled
      && inputs.tf_auto_apply_dev
      && contains(inputs.tf_environments, 'dev')
      && (inputs.is_default_branch == 'true' || inputs.is_tag == 'true')
    runs-on: ${{ inputs.runner }}
    environment: dev
    defaults:
      run:
        working-directory: ${{ inputs.tf_working_dir }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        if: inputs.tf_tool == 'terraform'
        with:
          terraform_version: ${{ inputs.tf_version }}

      - name: Setup OpenTofu
        if: inputs.tf_tool == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tf_version }}

      - name: AWS Login
        if: inputs.tf_cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Azure Login
        if: inputs.tf_cloud_provider == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: GCP Login
        if: inputs.tf_cloud_provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: ${{ inputs.tf_tool }} init

      - name: Select Workspace
        run: |
          ${{ inputs.tf_tool }} workspace select dev 2>/dev/null \
            || ${{ inputs.tf_tool }} workspace new dev

      - name: Detect var file
        id: varfile
        run: |
          VARFILE=""
          for candidate in "terraform.tfvars.dev" "dev.tfvars" "environments/dev.tfvars" "vars/dev.tfvars"; do
            if [[ -f "$candidate" ]]; then VARFILE="-var-file=$candidate"; break; fi
          done
          echo "args=$VARFILE" >> "$GITHUB_OUTPUT"

      - name: Terraform Apply
        run: |
          ${{ inputs.tf_tool }} apply \
            ${{ steps.varfile.outputs.args }} \
            -auto-approve \
            -no-color 2>&1 | tee apply-output.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🏗️ Terraform Apply — \`dev\`"
            echo ""
            echo "✅ Applied to **dev** environment."
            echo ""
            if [[ -f apply-output.txt ]]; then
              echo '```'
              tail -10 apply-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  tf-apply-staging:
    name: "🏗️ Apply — staging"
    needs: [tf-validate, tf-plan]
    if: >-
      inputs.has_terraform == 'true'
      && !inputs.tf_disabled
      && inputs.tf_auto_apply_staging
      && contains(inputs.tf_environments, 'staging')
      && (inputs.is_default_branch == 'true' || inputs.is_tag == 'true')
    runs-on: ${{ inputs.runner }}
    environment: staging
    defaults:
      run:
        working-directory: ${{ inputs.tf_working_dir }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        if: inputs.tf_tool == 'terraform'
        with:
          terraform_version: ${{ inputs.tf_version }}

      - name: Setup OpenTofu
        if: inputs.tf_tool == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tf_version }}

      - name: AWS Login
        if: inputs.tf_cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Azure Login
        if: inputs.tf_cloud_provider == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: GCP Login
        if: inputs.tf_cloud_provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: ${{ inputs.tf_tool }} init

      - name: Select Workspace
        run: |
          ${{ inputs.tf_tool }} workspace select staging 2>/dev/null \
            || ${{ inputs.tf_tool }} workspace new staging

      - name: Detect var file
        id: varfile
        run: |
          VARFILE=""
          for candidate in "terraform.tfvars.staging" "staging.tfvars" "environments/staging.tfvars" "vars/staging.tfvars"; do
            if [[ -f "$candidate" ]]; then VARFILE="-var-file=$candidate"; break; fi
          done
          echo "args=$VARFILE" >> "$GITHUB_OUTPUT"

      - name: Terraform Apply
        run: |
          ${{ inputs.tf_tool }} apply \
            ${{ steps.varfile.outputs.args }} \
            -auto-approve \
            -no-color 2>&1 | tee apply-output.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🏗️ Terraform Apply — \`staging\`"
            echo ""
            echo "✅ Applied to **staging** environment."
            echo ""
            if [[ -f apply-output.txt ]]; then
              echo '```'
              tail -10 apply-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  tf-apply-prod:
    name: "🏗️ Apply — prod"
    needs: [tf-validate, tf-plan]
    if: >-
      inputs.has_terraform == 'true'
      && !inputs.tf_disabled
      && contains(inputs.tf_environments, 'prod')
      && inputs.is_tag == 'true'
    runs-on: ${{ inputs.runner }}
    environment: production
    defaults:
      run:
        working-directory: ${{ inputs.tf_working_dir }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        if: inputs.tf_tool == 'terraform'
        with:
          terraform_version: ${{ inputs.tf_version }}

      - name: Setup OpenTofu
        if: inputs.tf_tool == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tf_version }}

      - name: AWS Login
        if: inputs.tf_cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Azure Login
        if: inputs.tf_cloud_provider == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: GCP Login
        if: inputs.tf_cloud_provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: ${{ inputs.tf_tool }} init

      - name: Select Workspace
        run: |
          ${{ inputs.tf_tool }} workspace select prod 2>/dev/null \
            || ${{ inputs.tf_tool }} workspace new prod

      - name: Detect var file
        id: varfile
        run: |
          VARFILE=""
          for candidate in "terraform.tfvars.prod" "prod.tfvars" "environments/prod.tfvars" "vars/prod.tfvars"; do
            if [[ -f "$candidate" ]]; then VARFILE="-var-file=$candidate"; break; fi
          done
          echo "args=$VARFILE" >> "$GITHUB_OUTPUT"

      - name: Terraform Apply
        run: |
          ${{ inputs.tf_tool }} apply \
            ${{ steps.varfile.outputs.args }} \
            -auto-approve \
            -no-color 2>&1 | tee apply-output.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🏗️ Terraform Apply — \`prod\` 🚀"
            echo ""
            echo "✅ Applied to **production** environment."
            echo ""
            if [[ -f apply-output.txt ]]; then
              echo '```'
              tail -10 apply-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────
  # Cost Estimation — Infracost (opt-in)
  # ──────────────────────────────────────────────────────────
  tf-cost:
    name: "🏗️ Cost Estimate"
    needs: tf-validate
    if: >-
      inputs.has_terraform == 'true'
      && !inputs.tf_disabled
      && inputs.tf_infracost_enabled
      && inputs.is_pr == 'true'
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.tf_working_dir }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate cost breakdown
        run: |
          infracost breakdown \
            --path=. \
            --format=json \
            --out-file=/tmp/infracost.json

      - name: Post PR comment
        uses: infracost/actions/comment@v1
        with:
          path: /tmp/infracost.json
          behavior: update
