# ═══════════════════════════════════════════════════════════════
# Code Haven — Deploy System Test Suite
#
# Multi-layer test strategy:
#
#   Layer 1 — Routing     Does every cloud/runtime have a module,
#                          template, case route, and tfvars handler?
#
#   Layer 2 — Contracts    Do module vars match template vars match
#                          tfvars JSON keys? (catches misalignment)
#
#   Layer 3 — Generation   Does generate-tfvars.sh produce correct
#                          JSON for every cloud/runtime combo?
#
#   Layer 4 — Validation   Does the generated Terraform workspace
#                          pass `terraform validate`?
#
#   Layer 5 — Simulation   Full simulation: fixture deploy.yml →
#                          merge → parse → generate workspace → validate
#
#   Layer 6 — Schema       Is every fixture valid against the
#                          deploy.schema.json?
#
# No cloud credentials needed. No infrastructure created.
# ═══════════════════════════════════════════════════════════════
name: "🧪 Deploy Test Suite"

on:
  push:
    paths:
      - 'actions/deploy-generate/**'
      - 'modules/**'
      - 'tests/**'
      - 'schemas/**'
      - '.github/workflows/_deploy.yml'
      - '.github/workflows/test-deploy.yml'
  pull_request:
    paths:
      - 'actions/deploy-generate/**'
      - 'modules/**'
      - 'tests/**'
      - 'schemas/**'

jobs:
  # ── Layer 1 + 2 + 3: Shell-based tests ────────────────────
  unit-tests:
    name: "🔬 Unit + Contract Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: "Layer 1: Routing tests"
        run: bash tests/unit/test-deploy-routing.sh

      - name: "Layer 2: Contract tests"
        run: bash tests/unit/test-contracts.sh

      - name: "Layer 3: TFVars generation tests"
        run: bash tests/unit/test-generate-tfvars.sh

  # ── Layer 4: Terraform validate ────────────────────────────
  tf-validate:
    name: "🏗️ TF Validate · ${{ matrix.runtime }}"
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - gcp-cloud-run
          - gcp-gke
          - gcp-compute
          - gcp-worker
          - gcp-cronjob
          - aws-ecs
          - azure-container-apps
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: "Simulate + Validate: ${{ matrix.runtime }}"
        run: |
          bash tests/local/simulate-deploy.sh \
            "tests/fixtures/${{ matrix.runtime }}" --plan

  # ── Layer 5: Full simulation across all fixtures ───────────
  full-simulation:
    name: "🎯 Full Simulation (all fixtures)"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Simulate all fixtures
        run: bash tests/local/simulate-deploy.sh --all --plan

  # ── Layer 6: Schema validation ─────────────────────────────
  schema-validation:
    name: "📐 Schema Validation"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install check-jsonschema pyyaml
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate schema is valid JSON Schema
        run: python -c "import json; json.load(open('schemas/deploy.schema.json'))"

      - name: Validate fixtures against schema
        run: |
          FAILURES=0
          for fixture in tests/fixtures/*/deploy.yml; do
            NAME=$(basename "$(dirname "$fixture")")
            TMPJSON=$(mktemp --suffix=.json)

            # Convert YAML to JSON for schema validation
            yq -o=json '.' "$fixture" > "$TMPJSON"

            if check-jsonschema --schemafile schemas/deploy.schema.json "$TMPJSON" 2>/dev/null; then
              echo "✅ $NAME"
            else
              echo "❌ $NAME"
              check-jsonschema --schemafile schemas/deploy.schema.json "$TMPJSON" 2>&1 | head -10
              FAILURES=$((FAILURES + 1))
            fi
            rm -f "$TMPJSON"
          done

          if [[ $FAILURES -gt 0 ]]; then
            echo "❌ $FAILURES fixture(s) failed schema validation"
            exit 1
          fi
          echo "✅ All fixtures valid"

      - name: Validate examples against schema
        run: |
          for example in examples/08-*.yml examples/09-*.yml examples/10-*.yml \
                         examples/11-*.yml examples/12-*.yml examples/13-*.yml \
                         examples/14-*.yml; do
            [[ ! -f "$example" ]] && continue
            NAME=$(basename "$example")
            TMPJSON=$(mktemp --suffix=.json)
            yq -o=json '.' "$example" > "$TMPJSON"

            if check-jsonschema --schemafile schemas/deploy.schema.json "$TMPJSON" 2>/dev/null; then
              echo "✅ $NAME"
            else
              echo "⚠️ $NAME (may use env-override fields)"
            fi
            rm -f "$TMPJSON"
          done

  # ── Gate ────────────────────────────────────────────────────
  all-tests:
    name: "✅ All Deploy Tests"
    runs-on: ubuntu-latest
    needs: [unit-tests, tf-validate, full-simulation, schema-validation]
    if: always()
    steps:
      - name: Check results
        run: |
          RESULTS=("${{ needs.unit-tests.result }}" \
                   "${{ needs.tf-validate.result }}" \
                   "${{ needs.full-simulation.result }}" \
                   "${{ needs.schema-validation.result }}")

          for r in "${RESULTS[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "❌ One or more test layers failed"
              exit 1
            fi
          done
          echo "✅ All test layers passed"
