# ═══════════════════════════════════════════════════════════════
# Code Haven — Java Build Pipeline (Maven + Gradle)
# Internal reusable workflow — called from devsecops.yml
# ═══════════════════════════════════════════════════════════════
name: "☕ Java"

on:
  workflow_call:
    inputs:
      runner: { type: string, default: 'ubuntu-latest' }
      has_pom: { type: string, default: 'false' }
      has_gradle: { type: string, default: 'false' }
      maven_disabled: { type: boolean, default: false }
      gradle_disabled: { type: boolean, default: false }
      java_version: { type: string, default: '21' }
      java_distribution: { type: string, default: 'temurin' }
      maven_cli_opts: { type: string, default: '--batch-mode --errors --fail-at-end --show-version' }
      maven_build_cmd: { type: string, default: 'install' }
      java_formatter: { type: string, default: 'revelc' }
      gradle_build_cmd: { type: string, default: 'build' }
      java_doc_enabled: { type: boolean, default: false }

jobs:
  # ── Maven ────────────────────────────────────────────────
  maven-build:
    name: "☕ Maven Build"
    if: inputs.has_pom == 'true' && !inputs.maven_disabled
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: maven
      - name: Maven Build
        run: mvn ${{ inputs.maven_cli_opts }} ${{ inputs.maven_build_cmd }}
      - uses: actions/upload-artifact@v5
        with:
          name: maven-target
          path: |
            **/target/*.jar
            **/target/*.war
            **/target/*.ear
            **/target/*-runner
            **/target/quarkus-app/**
            **/target/lib/**
            **/target/site
            **/target/*-reports
            **/target/surefire-reports
            **/target/failsafe-reports
            **/target/dependency-check-*
          retention-days: 1
      - name: Upload Docker inputs (Java/Maven)
        uses: actions/upload-artifact@v5
        with:
          name: docker-input-java
          path: |
            **/target/*.jar
            **/target/*.war
            **/target/*.ear
            **/target/*-runner
            **/target/quarkus-app/**
            **/target/lib/**
          if-no-files-found: ignore
          retention-days: 1
      - name: Publish test results
        if: >-
          !cancelled() &&
          (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) &&
          github.actor != 'dependabot[bot]'
        uses: dorny/test-reporter@v2
        continue-on-error: true
        with:
          name: Maven Tests
          path: '**/target/*-reports/*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  java-fmt:
    name: "☕ Java Format Check"
    if: inputs.has_pom == 'true' && !inputs.maven_disabled && inputs.java_formatter != 'disabled'
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: maven
      - name: Check formatting
        run: |
          if [[ "${{ inputs.java_formatter }}" == "spotify" ]]; then
            PLUGIN="com.spotify.fmt:fmt-maven-plugin"
            CHECK_GOAL="check"
            FIX_GOAL="format"
          else
            PLUGIN="net.revelc.code.formatter:formatter-maven-plugin"
            CHECK_GOAL="validate"
            FIX_GOAL="format"
          fi
          if ! mvn ${{ inputs.maven_cli_opts }} ${PLUGIN}:${CHECK_GOAL} 2>&1 | tee fmt-output.txt; then
            {
              echo "## ☕ Java Format Check — ❌ Failed"
              echo ""
              echo "> **What this does:** Checks that your Java source files follow the project's"
              echo "> code style rules. Consistent formatting makes code reviews easier."
              echo ""
              echo "### 🔧 Fix locally"
              echo '```bash'
              echo "mvn ${PLUGIN}:${FIX_GOAL}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "## ☕ Java Format Check — ✅ Passed" >> "$GITHUB_STEP_SUMMARY"
          fi

  java-doc:
    name: "☕ Javadoc"
    needs: maven-build
    if: >-
      always() &&
      needs.maven-build.result == 'success' &&
      inputs.java_doc_enabled == 'true'
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: maven
      - run: mvn ${{ inputs.maven_cli_opts }} javadoc:javadoc -DskipTests
      - uses: actions/upload-artifact@v5
        with:
          name: javadoc
          path: '**/target/site/apidocs'
          retention-days: 7

  # ── Gradle ───────────────────────────────────────────────
  gradle-build:
    name: "🐘 Gradle Build"
    if: inputs.has_gradle == 'true' && !inputs.gradle_disabled
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle ${{ inputs.gradle_build_cmd }}
      - uses: actions/upload-artifact@v5
        with:
          name: gradle-build
          path: |
            **/build/libs
            **/build/reports
            **/build/test-results
            **/build/docs
          retention-days: 1
      - name: Upload Docker inputs (Java/Gradle)
        uses: actions/upload-artifact@v5
        with:
          name: docker-input-gradle
          path: |
            **/build/libs/**
            **/build/native/**
          if-no-files-found: ignore
          retention-days: 1
      - name: Publish test results
        if: >-
          !cancelled() &&
          (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) &&
          github.actor != 'dependabot[bot]'
        uses: dorny/test-reporter@v2
        continue-on-error: true
        with:
          name: Gradle Tests
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  gradle-doc:
    name: "🐘 Gradle Javadoc"
    needs: gradle-build
    if: always() && needs.gradle-build.result == 'success'
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle javadoc
      - uses: actions/upload-artifact@v5
        with:
          name: gradle-javadoc
          path: '**/build/docs/javadoc'
          retention-days: 7
