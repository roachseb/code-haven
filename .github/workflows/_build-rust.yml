# ═══════════════════════════════════════════════════════════════
# Code Haven — Rust Build Pipeline
# Internal reusable workflow — called from devsecops.yml
# ═══════════════════════════════════════════════════════════════
name: "🦀 Rust"

on:
  workflow_call:
    inputs:
      runner: { type: string, default: 'ubuntu-latest' }
      rust_disabled: { type: boolean, default: false }
      rust_toolchain: { type: string, default: 'stable' }

jobs:
  rust-build:
    name: "🦀 Rust Build & Test"
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '${{ inputs.rust_toolchain }}', components: 'clippy, rustfmt' }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --verbose
      - name: Upload Docker inputs (Rust)
        uses: actions/upload-artifact@v4
        with:
          name: docker-input-rust
          path: |
            target/release/*
            !target/release/.fingerprint
            !target/release/build
            !target/release/deps
            !target/release/examples
            !target/release/incremental
            !target/release/.cargo-lock
          if-no-files-found: ignore
          retention-days: 1
      - run: cargo test --verbose 2>&1 | tee test-output.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## 🦀 Rust Build & Test"
            echo ""
            echo "> **What this does:** Compiles your Rust project and runs all unit and integration"
            echo "> tests. Tests are run with verbose output to show individual results."
            echo ""
            RESULT_LINE=$(grep '^test result:' test-output.txt 2>/dev/null || true)
            if echo "$RESULT_LINE" | grep -q 'FAILED'; then
              echo "### ❌ Tests Failed"
              echo ""
              echo "#### 🔧 Debug locally"
              echo '```bash'
              echo "cargo test -- --nocapture"
              echo '```'
            elif [[ -n "$RESULT_LINE" ]]; then
              PASSED=$(echo "$RESULT_LINE" | grep -oP '\d+ passed' || echo '? passed')
              echo "### ✅ All Tests Passed ($PASSED)"
            else
              echo "### ⚠️ No test output found"
            fi
            echo ""
            echo '<details><summary>Test output</summary>'
            echo ''
            echo '```'
            grep -E '^test |^test result:' test-output.txt || true
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  rust-fmt:
    name: "🦀 Rust Fmt"
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '${{ inputs.rust_toolchain }}', components: rustfmt }
      - name: Check formatting
        run: |
          if ! cargo fmt -- --check 2>&1 | tee fmt-output.txt; then
            {
              echo "## 🦀 Rust Format Check — ❌ Failed"
              echo ""
              echo "> **What this does:** Checks that your Rust code follows the standard style enforced by \`rustfmt\`."
              echo ""
              echo "### 🔧 Fix locally"
              echo '```bash'
              echo "cargo fmt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "## 🦀 Rust Format Check — ✅ Passed" >> "$GITHUB_STEP_SUMMARY"
          fi

  rust-clippy:
    name: "🦀 Rust Clippy"
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '${{ inputs.rust_toolchain }}', components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: |
          if ! cargo clippy -- -D warnings 2>&1 | tee clippy-output.txt; then
            {
              echo "## 🦀 Rust Clippy — ❌ Issues Found"
              echo ""
              echo "> **What this does:** Clippy catches common mistakes, performance issues, and"
              echo "> non-idiomatic Rust patterns that the compiler doesn't flag."
              echo ""
              echo "### 🔧 Fix locally"
              echo '```bash'
              echo "cargo clippy --fix --allow-dirty"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            {
              echo "## 🦀 Rust Clippy — ✅ Passed"
              echo ""
              echo "> Checks for common mistakes and non-idiomatic Rust patterns."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  rust-doc:
    name: "🦀 Rust Doc"
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly doc --no-deps
        env:
          RUSTDOCFLAGS: "--enable-index-page -Zunstable-options"
      - uses: actions/upload-artifact@v4
        with: { name: rust-doc, path: target/doc, retention-days: 7 }
