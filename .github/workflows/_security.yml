# ═══════════════════════════════════════════════════════════════
# Code Haven — Security Scanning Pipeline
# Internal reusable workflow — called from devsecops.yml
# ═══════════════════════════════════════════════════════════════
name: "🛡 Security"

on:
  workflow_call:
    inputs:
      runner: { type: string, default: 'ubuntu-latest' }
      has_sql: { type: string, default: 'false' }
      sast_disabled: { type: boolean, default: false }
      secret_detection_disabled: { type: boolean, default: false }
      dependency_scan_disabled: { type: boolean, default: false }
      iac_scan_disabled: { type: boolean, default: false }
      sonar_disabled: { type: boolean, default: false }
      checkmarx_disabled: { type: boolean, default: false }
      sqlfluff_disabled: { type: boolean, default: false }
      sonar_host_url: { type: string, default: '' }
      sonar_project_key: { type: string, default: '' }
      checkmarx_base_url: { type: string, default: '' }
      sqlfluff_dialect: { type: string, default: 'ansi' }
      semgrep_disabled: { type: boolean, default: false }
      osv_disabled: { type: boolean, default: false }
      license_check_disabled: { type: boolean, default: false }
      scorecard_disabled: { type: boolean, default: false }
    secrets:
      SONAR_TOKEN: { required: false }
      CHECKMARX_TOKEN: { required: false }
      CHECKMARX_USERNAME: { required: false }
      CHECKMARX_PASSWORD: { required: false }

jobs:
  # ── SAST (CodeQL) ───────────────────────────────────────
  sast:
    name: "🛡 SAST (CodeQL)"
    if: ${{ !inputs.sast_disabled }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect CodeQL languages
        id: detect
        run: |
          LANGS=""
          has_ext() {
            for ext in "$@"; do
              [[ -n "$(find . -name "*.$ext" \
                -not -path '*/node_modules/*' \
                -not -path '*/.git/*' \
                -print -quit 2>/dev/null)" ]] && return 0
            done
            return 1
          }
          has_ext py           && LANGS="${LANGS:+$LANGS,}python"
          has_ext js ts jsx tsx && LANGS="${LANGS:+$LANGS,}javascript-typescript"
          has_ext java kt      && LANGS="${LANGS:+$LANGS,}java-kotlin"
          has_ext go           && LANGS="${LANGS:+$LANGS,}go"
          has_ext cs vb        && LANGS="${LANGS:+$LANGS,}csharp"
          has_ext c cpp h      && LANGS="${LANGS:+$LANGS,}c-cpp"
          has_ext rb           && LANGS="${LANGS:+$LANGS,}ruby"
          has_ext swift        && LANGS="${LANGS:+$LANGS,}swift"

          if [[ -z "$LANGS" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ No CodeQL-supported languages — skipping SAST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "languages=$LANGS" >> "$GITHUB_OUTPUT"
            echo "🛡 CodeQL languages: \`$LANGS\`" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: github/codeql-action/init@v3
        if: steps.detect.outputs.skip != 'true'
        with:
          languages: ${{ steps.detect.outputs.languages }}
      - uses: github/codeql-action/autobuild@v3
        if: steps.detect.outputs.skip != 'true'
      - uses: github/codeql-action/analyze@v3
        if: steps.detect.outputs.skip != 'true'
        with: { category: 'sast' }

  # ── Secret Detection ────────────────────────────────────
  secret-detection:
    name: "🔑 Secret Detection"
    if: ${{ !inputs.secret_detection_disabled }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Dependency Scan ──────────────────────────────────────
  dependency-scan:
    name: "📦 Dependency Scan (Trivy FS)"
    if: ${{ !inputs.dependency_scan_disabled }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: dependency-results.sarif
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: dependency-results.sarif, category: 'dependency-scan' }
        continue-on-error: true

  # ── IaC Scan ─────────────────────────────────────────────
  iac-scan:
    name: "🏗 IaC Scan (KICS)"
    if: ${{ !inputs.iac_scan_disabled }}
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: checkmarx/kics-github-action@v2.1.3
        with:
          path: .
          output_path: kics-results
          output_formats: 'sarif,json'
          fail_on: high
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: kics-results/results.sarif, category: 'iac-scan' }
        continue-on-error: true

  # ── SonarQube ────────────────────────────────────────────
  sonarqube:
    name: "🔍 SonarQube"
    if: |
      !inputs.sonar_disabled
      && inputs.sonar_host_url != ''
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { path: artifacts }
      - uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.sonar_project_key || github.event.repository.name }}
            -Dsonar.projectName=${{ github.repository }}

  # ── Checkmarx ────────────────────────────────────────────
  checkmarx:
    name: "🛡 Checkmarx SAST"
    if: |
      !inputs.checkmarx_disabled
      && inputs.checkmarx_base_url != ''
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: checkmarx-ts/checkmarx-cxflow-github-action@v1.9
        with:
          checkmarx_url: ${{ inputs.checkmarx_base_url }}
          checkmarx_username: ${{ secrets.CHECKMARX_USERNAME }}
          checkmarx_password: ${{ secrets.CHECKMARX_PASSWORD }}
          checkmarx_client_secret: ${{ secrets.CHECKMARX_TOKEN }}
          project: ${{ github.event.repository.name }}-${{ github.ref_name }}
          scanners: sast
          break_build: false

  # ── SQLFluff ─────────────────────────────────────────────
  sqlfluff:
    name: "📊 SQLFluff Lint"
    if: inputs.has_sql == 'true' && !inputs.sqlfluff_disabled
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: pip install sqlfluff
      - name: Lint SQL
        run: |
          find . -name '*.sql' | head -100 | xargs sqlfluff lint \
            --dialect ${{ inputs.sqlfluff_dialect }} \
            --format github-annotation-native || true
          find . -name '*.sql' | head -100 | xargs sqlfluff lint \
            --dialect ${{ inputs.sqlfluff_dialect }} \
            --format json > sqlfluff-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sqlfluff-report, path: sqlfluff-report.json, retention-days: 7 }

  # ── Semgrep (SAST — open-source rules) ──────────────────
  semgrep:
    name: "🔎 Semgrep SAST"
    if: ${{ !inputs.semgrep_disabled }}
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan --config auto --sarif --output semgrep.sarif . || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif, category: 'semgrep' }
        continue-on-error: true
      - name: Summary
        if: always()
        run: |
          FINDINGS=$(grep -c '"level"' semgrep.sarif 2>/dev/null || echo "0")
          {
            echo "## 🔎 Semgrep SAST"
            echo "- Findings: **${FINDINGS}**"
            echo "- Config: \`auto\` (community + p/default)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── OSV Scanner (Google vulnerability DB) ───────────────
  osv-scanner:
    name: "🛡 OSV Scanner"
    if: ${{ !inputs.osv_disabled }}
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            --output=osv-results.json
            --format=json
            ./
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: osv-scanner-report, path: osv-results.json, if-no-files-found: ignore, retention-days: 7 }
      - name: Summary
        if: always()
        run: |
          if [[ -f osv-results.json ]]; then
            VULNS=$(grep -c '"id"' osv-results.json 2>/dev/null || echo "0")
            echo "## 🛡 OSV Scanner — $VULNS known vulnerabilities found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 🛡 OSV Scanner — ✅ No vulnerabilities detected" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── License Compliance Check ────────────────────────────
  license-check:
    name: "📜 License Compliance"
    if: ${{ !inputs.license_check_disabled }}
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check licenses
        run: |
          # Install license scanning tool
          pip install pip-licenses 2>/dev/null || true

          mkdir -p license-report
          REPORT="license-report/licenses.md"

          {
            echo "# License Compliance Report"
            echo ""
            echo "Generated: $(date -u)"
            echo ""
          } > "$REPORT"

          # Python dependencies
          if [[ -f requirements.txt ]] || [[ -f pyproject.toml ]]; then
            pip install -r requirements.txt 2>/dev/null || pip install . 2>/dev/null || true
            echo "## Python Dependencies" >> "$REPORT"
            pip-licenses --format=markdown >> "$REPORT" 2>/dev/null || true
            echo "" >> "$REPORT"
          fi

          # Node dependencies
          if [[ -f package.json ]]; then
            npx license-checker --summary --production 2>/dev/null | tee -a "$REPORT" || true
          fi

          # Check for copyleft licenses
          COPYLEFT=$(grep -iE "GPL|AGPL|LGPL|SSPL|EUPL" "$REPORT" 2>/dev/null || true)
          if [[ -n "$COPYLEFT" ]]; then
            echo "::warning::Copyleft licenses detected — review required"
            {
              echo ""
              echo "## ⚠️ Copyleft Licenses Detected"
              echo "$COPYLEFT"
            } >> "$REPORT"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: license-report, path: license-report, if-no-files-found: ignore, retention-days: 30 }

      - name: Summary
        if: always()
        run: |
          {
            echo "## 📜 License Compliance"
            if [[ -f license-report/licenses.md ]]; then
              TOTAL=$(grep -c '|' license-report/licenses.md 2>/dev/null || echo "0")
              echo "- Dependencies scanned: ~$TOTAL"
              if grep -qiE "GPL|AGPL|LGPL" license-report/licenses.md 2>/dev/null; then
                echo "- ⚠️ **Copyleft licenses detected** — manual review required"
              else
                echo "- ✅ No copyleft licenses found"
              fi
            else
              echo "- ⏭️ No dependency manifests detected"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── OSSF Scorecard (Supply Chain Security) ───────────────
  scorecard:
    name: "📊 OSSF Scorecard"
    if: ${{ !inputs.scorecard_disabled && github.event_name != 'pull_request' }}
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: scorecard-results.sarif, category: 'scorecard' }
        continue-on-error: true
