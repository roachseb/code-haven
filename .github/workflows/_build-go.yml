# ═══════════════════════════════════════════════════════════════
# Code Haven — Go Build Pipeline
# Internal reusable workflow — called from devsecops.yml
# ═══════════════════════════════════════════════════════════════
name: "🐹 Go"

on:
  workflow_call:
    inputs:
      runner: { type: string, default: 'ubuntu-latest' }
      golang_disabled: { type: boolean, default: false }
      golang_version: { type: string, default: 'stable' }

jobs:
  golang-build:
    name: "🐹 Go Build"
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with: { go-version: '${{ inputs.golang_version }}', cache: true }
      - run: go build -o app ./...
      - name: Upload Docker inputs (Go)
        uses: actions/upload-artifact@v4
        with:
          name: docker-input-go
          path: app
          if-no-files-found: ignore
          retention-days: 1

  golang-test:
    name: "🐹 Go Test"
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with: { go-version: '${{ inputs.golang_version }}', cache: true }
      - name: Test with coverage
        run: |
          go install gotest.tools/gotestsum@latest
          gotestsum --junitfile go-test-report.xml -- -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          TOTAL=$(grep -c '<testcase' go-test-report.xml 2>/dev/null || echo "0")
          FAILURES=$(grep -c '<failure' go-test-report.xml 2>/dev/null || echo "0")
          {
            echo "## 🐹 Go Test & Coverage"
            echo ""
            echo "> **What this does:** Runs all Go tests with race detection enabled and measures"
            echo "> how much of your code is exercised by tests (code coverage)."
            echo ""
            if [[ "$FAILURES" -eq 0 ]]; then
              echo "- ✅ **${TOTAL}** tests passed"
            else
              echo "- ❌ **${FAILURES}** of **${TOTAL}** tests failed"
              echo ""
              echo "#### 🔧 Debug locally"
              echo '```bash'
              echo "go test -race -v ./..."
              echo '```'
            fi
            echo "- 📊 Coverage: **${COVERAGE}**"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-reports
          path: |
            go-test-report.xml
            coverage.html
            coverage.out
          retention-days: 7
      - uses: dorny/test-reporter@v2
        if: >-
          !cancelled() &&
          (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) &&
          github.actor != 'dependabot[bot]'
        continue-on-error: true
        with:
          name: Go Tests
          path: go-test-report.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  golang-lint:
    name: "🐹 Go Lint"
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with: { go-version: '${{ inputs.golang_version }}', cache: true }
      - uses: golangci/golangci-lint-action@v6

  golang-fmt:
    name: "🐹 Go Fmt"
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with: { go-version: '${{ inputs.golang_version }}', cache: true }
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "::warning::Unformatted Go files:"
            echo "$unformatted"
            {
              echo "## 🐹 Go Format Check — ❌ Failed"
              echo ""
              echo "> **What this does:** Checks that all Go source files follow the standard"
              echo "> formatting rules enforced by \`gofmt\`."
              echo ""
              echo "Files needing format:"
              echo '```'
              echo "$unformatted"
              echo '```'
              echo ""
              echo "### 🔧 Fix locally"
              echo '```bash'
              echo "gofmt -w ."
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "## 🐹 Go Format Check — ✅ Passed" >> "$GITHUB_STEP_SUMMARY"
          fi

  golang-vet:
    name: "🐹 Go Vet"
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with: { go-version: '${{ inputs.golang_version }}', cache: true }
      - run: go vet ./...
