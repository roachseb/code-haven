# ── Pages ──────────────────────────────────────────────────────
# Deploys documentation, coverage reports, and artifacts to GitHub Pages.
name: "\U0001F4D6 Pages"

on:
  workflow_run:
    workflows: ["\U0001F3D7️ Build"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    if: github.event.workflow_run.conclusion == 'success'
    uses: roachseb/code-haven/.github/workflows/_orchestrate-pages.yml@main
    secrets: inherit
