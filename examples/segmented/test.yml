name: "\U0001F9EA Test"

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write

jobs:
  test:
    uses: roachseb/code-haven/.github/workflows/_orchestrate-test.yml@main
    secrets: inherit
