# ═══════════════════════════════════════════════════════════════
# Example 13 — Fullstack Monorepo (React + API)
# Demonstrates a monorepo with separate frontend and backend
# packages. Uses npm workspaces for unified build/test, then
# smart change-detection to only rebuild & deploy changed services.
#
# Architecture:
#   packages/frontend/  →  React (Vite) → Nginx container
#   packages/api/       →  Fastify API  → Node container
#
# Flow:
#   1. Code Haven runs CI on entire repo (build, test, scan)
#   2. detect-changes job identifies WHICH packages were modified
#   3. Only changed services get Docker images built + pushed
#   4. Deploy job rolls out only what changed
# ═══════════════════════════════════════════════════════════════
name: CI/CD
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: write
  checks: write
  pull-requests: write
  packages: write
  pages: write
  id-token: write
  security-events: write
  actions: read

jobs:
  # ── Code Haven CI (whole repo) ──────────────────────────────
  ci:
    uses: code-haven/code-haven/.github/workflows/devsecops.yml@main
    with:
      node_version: '20'
      node_build_args: 'run build'
      node_test_args: 'run test'
      # Monorepo: disable Code Haven's Docker (we do per-service below)
      docker_disabled: true
      maven_disabled: true
      gradle_disabled: true
      python_disabled: true
      rust_disabled: true
      dotnet_disabled: true
      php_disabled: true
      golang_disabled: true
      cpp_disabled: true
    secrets: inherit

  # ── Detect which packages changed ──────────────────────────
  detect-changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.check.outputs.api }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check paths
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DIFF=$(git diff --name-only "$BASE" HEAD)
          echo "api=$(echo "$DIFF" | grep -q '^packages/api/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(echo "$DIFF" | grep -q '^packages/frontend/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ── Build & push API image (only if API changed) ───────────
  docker-api:
    needs: [ci, detect-changes]
    if: needs.ci.result == 'success' && needs.detect-changes.outputs.api == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: ./packages/api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }},ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # ── Build & push frontend image (only if frontend changed) ─
  docker-frontend:
    needs: [ci, detect-changes]
    if: needs.ci.result == 'success' && needs.detect-changes.outputs.frontend == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: ./packages/frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }},ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
