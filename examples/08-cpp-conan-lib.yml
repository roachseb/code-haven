# ═══════════════════════════════════════════════════════════════
# Example 8 — C++ Library with Conan Package Publishing
# Demonstrates a C++ library project that builds, tests, lints,
# and publishes a Conan package for consumption by other projects.
# ═══════════════════════════════════════════════════════════════
name: CI/CD
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write
  checks: write
  pull-requests: write
  packages: write
  pages: write
  id-token: write
  security-events: write
  actions: read

jobs:
  # ── Standard CI pipeline ────────────────────────────────────
  ci:
    uses: code-haven/code-haven/.github/workflows/devsecops.yml@main
    with:
      # C/C++ configuration
      cpp_compiler: 'gcc'
      cpp_compiler_version: '13'
      cpp_standard: '20'
      cpp_build_type: 'Release'
      cpp_coverage_enabled: true

      # Conan remote for cross-project dependencies
      cpp_conan_remote: ${{ vars.CONAN_REMOTE_URL }}
    secrets: inherit

  # ── Publish Conan package (only on main/tags) ───────────────
  publish:
    needs: ci
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: code-haven/code-haven/actions/cpp-package@main
        with:
          conan_remote_url: ${{ secrets.CONAN_REMOTE_URL }}
          conan_remote_name: company-packages
          conan_login_username: ${{ secrets.CONAN_LOGIN_USERNAME }}
          conan_login_password: ${{ secrets.CONAN_LOGIN_PASSWORD }}
          cmake_build_type: Release
          cpp_standard: '20'
          upload_package: 'true'
