# ═══════════════════════════════════════════════════════════════
# Example 12 — GCP Worker (Background Job)
#
# Pub/Sub consumer that processes messages without ingress.
# Demonstrates: worker kind, Cloud Run Job, no schedule = on-demand.
# ═══════════════════════════════════════════════════════════════

kind: worker
cloud: gcp
runtime: cloud-run
team: data
region: us-central1

resources:
  cpu: "2"
  memory: 2Gi

timeout: 900
max_retries: 3
parallelism: 1
task_count: 1

env:
  SUBSCRIPTION: projects/my-project/subscriptions/work-queue
  BATCH_SIZE: "100"
