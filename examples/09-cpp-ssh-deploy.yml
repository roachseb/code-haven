# ═══════════════════════════════════════════════════════════════
# Example 9 — C++ Application with SSH Deployment
# Demonstrates building a C++ binary and deploying it to a
# remote server via SSH using the ssh-deploy composite action.
# ═══════════════════════════════════════════════════════════════
name: CI/CD
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: write
  checks: write
  pull-requests: write
  packages: write
  pages: write
  id-token: write
  security-events: write
  actions: read

jobs:
  # ── Standard CI pipeline (C++ build + test + scan) ──────────
  ci:
    uses: code-haven/code-haven/.github/workflows/devsecops.yml@main
    with:
      cpp_compiler: 'gcc'
      cpp_compiler_version: '13'
      cpp_standard: '20'
      cpp_build_type: 'Release'
      cpp_coverage_enabled: true

      # Also build Docker image as alternative deployment
      docker_registry: 'ghcr.io'
    secrets: inherit

  # ── Deploy via SSH (only on main branch) ────────────────────
  deploy-production:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      # Download the built binary artifact from CI
      - uses: actions/download-artifact@v4
        with:
          name: cpp-build-output
          path: ./dist

      # Package the binary for transfer
      - name: Package artifact
        run: tar -czf app.tar.gz -C dist .

      # Deploy to production server via SSH
      - uses: code-haven/code-haven/actions/ssh-deploy@main
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          user: deploy
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: '22'
          deploy_script: deploy/deploy.sh
          deploy_path: /opt/my-cpp-app
          artifact_path: ./app.tar.gz
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          post_deploy_commands: 'curl -sf http://localhost:8080/health'

  # ── Deploy to staging (on develop) ─────────────────────────
  deploy-staging:
    needs: ci
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: cpp-build-output
          path: ./dist

      - name: Package artifact
        run: tar -czf app.tar.gz -C dist .

      - uses: code-haven/code-haven/actions/ssh-deploy@main
        with:
          host: ${{ secrets.STAGING_HOST }}
          user: deploy
          ssh_key: ${{ secrets.STAGING_SSH_KEY }}
          deploy_script: deploy/deploy.sh
          deploy_path: /opt/my-cpp-app
          artifact_path: ./app.tar.gz
          known_hosts: ${{ secrets.STAGING_KNOWN_HOSTS }}
