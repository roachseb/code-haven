team: platform
cloud: gcp
runtime: cloud-run
kind: service
region: us-central1
project_id: my-project-dev

services:
  - name: api
    port: 8080
    expose: public
    resources:
      cpu: "1"
      memory: 512Mi
    replicas:
      min: 2
      max: 10
    health:
      path: /api/health
    env:
      SERVICE_ROLE: api

  - name: worker
    kind: worker
    resources:
      cpu: "2"
      memory: 1Gi
    env:
      SERVICE_ROLE: worker
      QUEUE: projects/my-project/subscriptions/tasks

  - name: web
    port: 3000
    expose: public
    resources:
      cpu: "0.5"
      memory: 256Mi
    replicas:
      min: 1
      max: 5
    health:
      path: /
    env:
      SERVICE_ROLE: web
      API_URL: https://api.internal
