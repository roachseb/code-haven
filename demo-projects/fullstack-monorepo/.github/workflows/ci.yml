# ═══════════════════════════════════════════════════════════════
# Code Haven Demo: Fullstack Monorepo (Frontend + API)
#
# Smart deployment flow:
#   1. Code Haven CI runs build/test/scan on the WHOLE repo
#      (it auto-detects package.json + Dockerfile)
#   2. A change-detection job figures out WHICH packages changed
#   3. Only changed services get their Docker image rebuilt & deployed
#
# This pattern works for any monorepo where services share a repo
# but deploy independently: React+API, Admin+API, Micro-frontends, etc.
# ═══════════════════════════════════════════════════════════════
name: CI/CD
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: write
  checks: write
  pull-requests: write
  packages: write
  pages: write
  id-token: write
  security-events: write
  actions: read

jobs:
  # ── Stage 1: Code Haven CI (build, test, lint, scan) ────────
  # Runs on the WHOLE repo — npm workspaces handles both packages
  ci:
    uses: code-haven/code-haven/.github/workflows/devsecops.yml@main
    with:
      node_version: '20'
      node_build_args: 'run build'
      node_test_args: 'run test'
      # Let Code Haven detect Dockerfiles and scan them
      docker_disabled: true       # We handle Docker per-service below
      # Disable unrelated stacks
      maven_disabled: true
      gradle_disabled: true
      python_disabled: true
      rust_disabled: true
      dotnet_disabled: true
      php_disabled: true
      golang_disabled: true
      cpp_disabled: true
    secrets: inherit

  # ── Stage 2: Detect which packages changed ──────────────────
  detect-changes:
    name: "🔍 Detect Changed Packages"
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.changes.outputs.api }}
      frontend_changed: ${{ steps.changes.outputs.frontend }}
      infra_changed: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Detect changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # If no base (first push), mark everything changed
          if [[ -z "$BASE" ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "api=true"      >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "infra=true"    >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD)

          api_changed="false"
          frontend_changed="false"
          infra_changed="false"

          echo "$CHANGED" | grep -q '^packages/api/'       && api_changed="true"
          echo "$CHANGED" | grep -q '^packages/frontend/'  && frontend_changed="true"
          echo "$CHANGED" | grep -qE '^(docker-compose|\.github/|package\.json|Dockerfile)' && infra_changed="true"

          echo "api=$api_changed"           >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend_changed" >> "$GITHUB_OUTPUT"
          echo "infra=$infra_changed"       >> "$GITHUB_OUTPUT"

          {
            echo "## 🔍 Changed Packages"
            echo "| Package | Changed |"
            echo "|---------|---------|"
            echo "| API | $([[ $api_changed == 'true' ]] && echo '✅' || echo '⬜') |"
            echo "| Frontend | $([[ $frontend_changed == 'true' ]] && echo '✅' || echo '⬜') |"
            echo "| Infra | $([[ $infra_changed == 'true' ]] && echo '✅' || echo '⬜') |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Stage 3a: Build & Push API Docker Image ─────────────────
  docker-api:
    name: "🐳 API Image"
    needs: [ci, detect-changes]
    if: |
      always()
      && needs.ci.result == 'success'
      && (needs.detect-changes.outputs.api_changed == 'true' || needs.detect-changes.outputs.infra_changed == 'true')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./packages/api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # ── Stage 3b: Build & Push Frontend Docker Image ────────────
  docker-frontend:
    name: "🐳 Frontend Image"
    needs: [ci, detect-changes]
    if: |
      always()
      && needs.ci.result == 'success'
      && (needs.detect-changes.outputs.frontend_changed == 'true' || needs.detect-changes.outputs.infra_changed == 'true')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./packages/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ── Stage 4: Deploy Summary ────────────────────────────────
  deploy-summary:
    name: "📋 Deploy Summary"
    needs: [detect-changes, docker-api, docker-frontend]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## 🚀 Monorepo Deployment"
            echo ""
            echo "| Service | Changed | Image Built | Status |"
            echo "|---------|---------|-------------|--------|"
            echo "| API | ${{ needs.detect-changes.outputs.api_changed }} | ${{ needs.docker-api.result == 'success' && '✅' || '⬜' }} | ${{ needs.docker-api.result || 'skipped' }} |"
            echo "| Frontend | ${{ needs.detect-changes.outputs.frontend_changed }} | ${{ needs.docker-frontend.result == 'success' && '✅' || '⬜' }} | ${{ needs.docker-frontend.result || 'skipped' }} |"
            echo ""
            echo "Only changed services were rebuilt. Unchanged services keep their existing image."
          } >> "$GITHUB_STEP_SUMMARY"
