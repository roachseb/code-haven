# Quarkus application configuration
quarkus.application.name=quarkus-demo
quarkus.http.port=8080

# Datasource (H2 for dev, PostgreSQL for prod)
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:devdb
%dev.quarkus.hibernate-orm.database.generation=drop-and-create

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb
%test.quarkus.hibernate-orm.database.generation=drop-and-create

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
%prod.quarkus.datasource.username=${DB_USER:app}
%prod.quarkus.datasource.password=${DB_PASSWORD:secret}
%prod.quarkus.hibernate-orm.database.generation=update

# Health and metrics
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics

# Native image settings
quarkus.native.additional-build-args=--initialize-at-run-time=com.example
